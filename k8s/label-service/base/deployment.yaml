apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: label-service
  template:
    metadata:
      labels:
        app: label-service
    spec:
      containers:
        - name: label-service
          # Registry and tag are set per environment by the overlays (images: transformer)
          image: ghcr.io/biscanin/label-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
