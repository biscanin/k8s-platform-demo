apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: label-service
resources:
  - ../../base
  - ingress.yaml
labels:
  - pairs:
      environment: dev
images:
  - name: ghcr.io/biscanin/label-service
    newTag: sha-29490cd
replicas:
  - name: label-service
    count: 2
configMapGenerator:
  - name: label-service-config
    behavior: merge
    literals:
      - APP_ENVIRONMENT=dev
      - APP_DEFAULT_CURRENCY=EUR
