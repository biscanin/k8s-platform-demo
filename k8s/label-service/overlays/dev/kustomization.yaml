apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: label-service
resources:
  - ../../base
labels:
  - pairs:
      environment: dev
images:
  - name: ghcr.io/biscanin/label-service
    newTag: REPLACE_AFTER_FIRST_CI   # e.g. sha-abc1234, taken from the GHCR package
replicas:
  - name: label-service
    count: 2
