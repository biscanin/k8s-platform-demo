apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: label-service
resources:
  - ../../base
labels:
  - pairs:
      environment: prod
images:
  - name: ghcr.io/biscanin/label-service
    newTag: REPLACE_AFTER_FIRST_CI   # promoted via PR: copy the tag that was verified in dev
replicas:
  - name: label-service
    count: 2
