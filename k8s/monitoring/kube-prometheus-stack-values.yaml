# Lean values for kube-prometheus-stack on the k3d "dev" cluster (low RAM laptop).
# Install: helm upgrade --install kps prometheus-community/kube-prometheus-stack \
#            -n monitoring --create-namespace -f kube-prometheus-stack-values.yaml

# k3s runs scheduler / controller-manager / etcd / kube-proxy inside one process,
# so their metrics endpoints are not reachable as separate targets -> disable to avoid noisy "down" alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    # Same reason as above: these rules would always fire on k3s.
    etcd: false
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up ServiceMonitors / PrometheusRules from ALL namespaces,
    # not only those labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 100Mi

grafana:
  # Admin password is generated by the chart into Secret "kps-grafana" (never commit a password).
  resources:
    requests:
      memory: 150Mi
    limits:
      # 250Mi was OOMKilled at startup (Grafana 13); 512Mi is stable.
      memory: 512Mi

prometheus-node-exporter:
  resources:
    limits:
      memory: 50Mi

kube-state-metrics:
  resources:
    limits:
      memory: 100Mi
