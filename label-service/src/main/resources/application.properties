spring.application.name=label-service

# Actuator: health (with liveness/readiness probes for Kubernetes) and metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Environment-specific settings. In Kubernetes they come from a ConfigMap / Secret as
# environment variables (APP_*); the defaults after the colon are for local runs.
app.environment=${APP_ENVIRONMENT:local}
app.default-currency=${APP_DEFAULT_CURRENCY:EUR}
# Secret: if empty, writes are not protected (local dev only)
app.api-key=${APP_API_KEY:}
