name: label-service CI

on:
  push:
    branches: [main]
    paths:
      - "label-service/**"
      - ".github/workflows/label-service-ci.yaml"
  pull_request:
    paths:
      - "label-service/**"
  workflow_dispatch:

# Least privilege: the token can read the repo and write packages (GHCR), nothing else.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/label-service

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU + Buildx let one runner produce images for several CPU architectures.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Generates tags (sha-abc1234) and OCI labels. It also lowercases the image name,
      # which GHCR requires.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      # Step 1: build amd64 only, load it into the runner's local Docker (no push yet).
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: label-service
          platforms: linux/amd64
          load: true
          tags: label-service:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: THE GATE. Fail the pipeline on fixable HIGH/CRITICAL vulnerabilities,
      # so a vulnerable image is never pushed to the registry.
      - name: Trivy vulnerability scan (gate)
        # Pinned to the commit of v0.36.0: tags can be moved, a commit SHA cannot (supply-chain hygiene)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: label-service:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: only reached when the gate passed. Multi-arch build (Pi = arm64) and push.
      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: label-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
