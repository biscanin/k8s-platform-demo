apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-service
  labels:
    app: label-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: label-service
  template:
    metadata:
      labels:
        app: label-service
    spec:
      containers:
        - name: label-service
          image: label-service:0.1.0
          # Image was imported into the nodes (k3d image import), never pull from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Is the app stuck? If this fails, kubelet restarts the container.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          # Can the app take traffic? If this fails, the Service stops routing to this Pod.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: label-service
  labels:
    app: label-service
spec:
  type: ClusterIP
  selector:
    app: label-service
  ports:
    - port: 80
      targetPort: 8080
